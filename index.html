<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>capimmm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- fundo: gradiente por padrão, vira vídeo automaticamente se assets/background.mp4 existir -->
  <div class="bg-video-wrap" id="bgVideoWrap" hidden>
    <video id="bgVideo" muted loop playsinline></video>
    <div class="bg-overlay"></div>
  </div>
  <audio id="bgAudio" loop></audio>

  <div class="glow" id="glow"></div>
  <div class="cursor-glitch" id="cursorGlitch">
    <span></span><span></span><span></span>
  </div>

  <main class="page">
    <header class="profile" data-reveal>
      <div class="avatar-wrap">
        <div class="avatar-ring"></div>
        <div class="avatar" id="avatar">
          <span class="avatar-dot"></span>
          <img src="avatar.jpg" alt="" onerror="this.style.display='none'">
          <div class="avatar-shine"></div>
        </div>
      </div>
      <h1 class="name">capimmm</h1>
      <p class="tagline">dev de interfaces, bots e coisas que brilham no escuro</p>
    </header>

    <section class="cards" id="cards" data-reveal></section>
  </main>

  <div class="overlay" id="overlay">
    <div class="panel" id="panel">
      <button class="panel-close" id="panelClose" aria-label="Fechar">✕</button>
      <div class="panel-top">
        <div class="panel-icon" id="panelIcon"></div>
        <button class="panel-sound" id="panelSound" hidden aria-label="Tocar som">
          <svg id="panelSoundPlay" viewBox="0 0 24 24" fill="none"><path d="M5 9v6h4l5 4V5L9 9H5z" fill="currentColor"/><path d="M16.5 9a4 4 0 0 1 0 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <svg id="panelSoundPause" viewBox="0 0 24 24" fill="none" hidden><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>
        </button>
      </div>
      <img class="panel-image" id="panelImage" hidden alt="">
      <h2 class="panel-title" id="panelTitle"></h2>
      <p class="panel-text" id="panelText">Carregando...</p>
      <a class="panel-visit" id="panelVisit" href="#" rel="noopener">
        <span id="panelVisitLabel">Visitar</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 12L12 4M12 4H6M12 4V10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
  </div>

  <!-- hotbar de mídia: só aparece se existir assets/background.mp4 e/ou assets/music.mp3
       vídeo e música tocam e pausam sempre juntos -->
  <div class="hotbar" id="hotbar" hidden>
    <div class="hotbar-wave" id="hotbarWave"></div>

    <input type="range" class="hotbar-seek" id="hotbarSeek" min="0" max="100" step="0.1" value="0">

    <div class="hotbar-controls">
      <button class="hotbar-icon-btn" id="hotbarRepeat" aria-label="Repetir" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 3v3a2 2 0 0 0 2 2h9M18 21v-3a2 2 0 0 0-2-2H7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 6L4 4m2 2L4 8M18 18l2 2m-2-2l2-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <button class="hotbar-icon-btn" id="hotbarPrev" aria-label="Voltar 10 segundos">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 5L5 12l7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 5l-7 7 7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <button class="hotbar-play" id="hotbarPlay" aria-label="Tocar ou pausar">
        <svg id="hotbarIconPlay" viewBox="0 0 24 24" fill="none"><path d="M8 5.5v13l11-6.5-11-6.5z" fill="currentColor"/></svg>
        <svg id="hotbarIconPause" viewBox="0 0 24 24" fill="none" hidden><rect x="6" y="5" width="4.5" height="14" rx="1.2" fill="currentColor"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.2" fill="currentColor"/></svg>
      </button>

      <button class="hotbar-icon-btn" id="hotbarNext" aria-label="Avançar 10 segundos">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 5l7 7-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 5l7 7-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <button class="hotbar-icon-btn" id="hotbarShuffle" aria-label="Reiniciar do começo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 6h3.5L14 17h3.5M3 17h3.5L11 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 6h2.5M17.5 6l-2 -2m2 2l-2 2M15 17h2.5M17.5 17l-2-2m2 2l-2 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
